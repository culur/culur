name: 🛠️ Build and release

on: [push, pull_request]

jobs:
  #! ----- ----- ----- Build and test ----- ----- ----- !#
  build:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      NX_KEY: ${{ secrets.NX_KEY }}
    steps:
      #! Checkout
      - name: ⬇️ Checkout
        uses: actions/checkout@v7
        with:
          # This makes Actions fetch all Git history for validate commit
          fetch-depth: 0

      #! Install dependencies
      - name: 📥 Install dependencies
        uses: ./.github/actions/install-dependencies

      #! Build
      - name: 🛠️ Build
        run: pnpm build

      #! Lint
      - name: 🧹 Lint
        run: pnpm lint

      #! Test
      - name: 🐛 Test
        run: pnpm test

      #! Validate commit
      - name: 💬 Validate current commit (last commit) with commitlint
        if: github.event_name == 'push'
        run: pnpm commitlint --from origin/main --to HEAD --verbose

      - name: 💬 Validate PR commits with commitlint
        if: github.event_name == 'pull_request'
        run: pnpm commitlint --from ${{ github.event.pull_request.head.sha }}~${{ github.event.pull_request.commits }} --to ${{ github.event.pull_request.head.sha }} --verbose

      #! Find coverage files
      - name: 🔎 Find coverage files
        id: coverage-files
        run: echo "files=$(find . -path ./.nx -prune , -type f -name coverage-final.json | paste -sd,)" >> $GITHUB_OUTPUT

      #! Upload Coverage
      - name: ⬆️ Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ${{ steps.coverage-files.outputs.files }}
          disable_search: true

  #! ----- ----- ----- Release preflight ----- ----- ----- !#
  # Dry-run what the release job does, so missing permissions or broken release files fail early:
  # - `changeset version` + lint: the release pull request must pass CI
  # - `npm pack --dry-run`: every package can be packed
  # - trusted publishing token exchange: every public package can be published from this workflow
  release-preflight:
    name: Release preflight
    if: "${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/release' || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'chore: version packages')) }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for the trusted publishing check
    steps:
      #! Checkout
      - name: ⬇️ Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      #! Install dependencies
      - name: ⬇️ Install dependencies
        uses: ./.github/actions/install-dependencies

      #! Build
      - name: 🛠️ Build
        run: pnpm build

      #! Version packages (dry-run)
      - name: 🦋 Version packages (dry-run)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md')" ]; then
            pnpm changeset:version
          else
            echo "No changesets, skip changeset version"
          fi

      #! Lint versioned files
      - name: 🧹 Lint versioned files
        run: pnpm lint

      #! Pack (dry-run)
      - name: 📦 Pack packages (dry-run)
        run: pnpm -r --filter "@culur/*" --filter "!@culur/monorepo" exec npm pack --dry-run

      #! Trusted publishing
      - name: 🔐 Check npm trusted publishing
        if: github.event_name == 'push'
        run: pnpm tsx .github/scripts/check-npm-trusted-publishing.ts

  #! ----- ----- ----- Prepare release ----- ----- ----- !#
  release:
    name: Create pull request or publish to npm
    needs: [build, release-preflight]
    if: "${{ github.ref == 'refs/heads/release' || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'chore: version packages')) }}"
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC
      contents: write # Required for write git tag
      pull-requests: write # Required for create pull requests
    steps:
      #! Checkout
      - name: ⬇️ Checkout
        uses: actions/checkout@v7
        with:
          # This makes Actions fetch all Git history so that Changesets can generate changelogs with the correct commits
          fetch-depth: 0

      #! Install dependencies
      - name: ⬇️ Install dependencies
        uses: ./.github/actions/install-dependencies

      #! Build
      - name: 🛠️ Build
        run: pnpm build

      #! Create pull request or publish to npm
      - name: 🚀 Create pull request or publish to npm
        id: changesets
        uses: changesets/action@v2.1.2
        with:
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
          pr-base-branch: main
          version-script: pnpm changeset:version
          publish-script: pnpm changeset:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only add NPM_TOKEN to GitHub repository secrets when releasing a new package for the first time.
          # When NPM_TOKEN secret is absent, CI will automatically use OIDC Tokenless (Trusted Publishing).
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
