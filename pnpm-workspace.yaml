packages:
  - apps/*
  - packages/*
  - scripts/*
  - templates/*

overrides:
  '@graphql-tools/executor-graphql-ws': ^3.1.5
  '@graphql-tools/executor-http': ^3.3.0
  chokidar: ^5.0.0
  semver: ^7.8.5
  sucrase: ^3.35.1

minimumReleaseAge: 0
trustPolicy: no-downgrade

allowBuilds:
  electron: false
  esbuild: true
  nx: true

shellEmulator: true
